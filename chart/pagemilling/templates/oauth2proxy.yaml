{{- if .Values.oauth2proxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pagemilling.fullname" . }}-oauth2-proxy
  labels:
    {{- include "pagemilling.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth2-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "pagemilling.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: oauth2-proxy
  template:
    metadata:
      labels:
        {{- include "pagemilling.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: {{ .Values.oauth2proxy.image }}
          args:
            - --provider=github
            - --email-domain=*
            - --upstream=http://{{ include "pagemilling.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.service.port }}
            - --proxy-prefix=/oauth2
            - --http-address=0.0.0.0:4180
            - --cookie-secure=true
            - --cookie-domain={{ .Values.ingress.host }}
            - --github-user={{ .Values.oauth2proxy.githubUsers }}
            - --reverse-proxy=true
            - --redirect-url=https://{{ .Values.ingress.host }}/oauth2/callback
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "pagemilling.fullname" . }}-oauth2-proxy
                  key: client-id
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pagemilling.fullname" . }}-oauth2-proxy
                  key: client-secret
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pagemilling.fullname" . }}-oauth2-proxy
                  key: cookie-secret
          ports:
            - name: http
              containerPort: 4180
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pagemilling.fullname" . }}-oauth2-proxy
  labels:
    {{- include "pagemilling.labels" . | nindent 4 }}
    app.kubernetes.io/component: oauth2-proxy
spec:
  type: ClusterIP
  ports:
    - port: 4180
      targetPort: 4180
      protocol: TCP
      name: http
  selector:
    {{- include "pagemilling.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: oauth2-proxy
{{- end }}
