{{- if .Values.oauth2proxy.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pagemilling.fullname" . }}-oauth2-proxy
  labels:
    {{- include "pagemilling.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-id: {{ .Values.oauth2proxy.githubClientId | quote }}
  client-secret: {{ .Values.oauth2proxy.githubClientSecret | quote }}
  cookie-secret: {{ .Values.oauth2proxy.cookieSecret | quote }}
{{- end }}
